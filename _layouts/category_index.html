---
layout: custom_page
---
<ul class="toc">
  {% assign posts = site.categories[page.category] %}
  {% for post in posts %}
    <li>
      <a href="{{ post.url }}">
        <i class="fa fa-file-text-o"></i>
        {{ post.title | replace: 'and', '&' | replace: 'Faq', 'FAQ' | replace: 'Ssh', 'SSH'}}
      </a>
    </li>
  {% endfor %}
</ul>
