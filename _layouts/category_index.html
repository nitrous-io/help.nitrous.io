---
layout: custom_page
---
<ul class="toc entries">
  {% assign posts = site.categories[page.category] %}
  {% for post in posts %}
    <li>
      <p>
        <a href="{{ post.url }}">
          {{ post.title | replace: 'and', '&' | replace: 'Faq', 'FAQ' | replace: 'Ssh', 'SSH'}}
        </a>
      </p>
    </li>
  {% endfor %}
</ul>
